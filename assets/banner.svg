<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-label="Manjeet Singh Shekhawat - AI and Data Science, Full-Stack Developer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05070c"/>
      <stop offset="55%" stop-color="#071a2b"/>
      <stop offset="100%" stop-color="#0a3a3a"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00f5d4"/>
      <stop offset="100%" stop-color="#00bbf9"/>
    </linearGradient>
    <linearGradient id="waveA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00f5d4" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#00bbf9" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="waveB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00bbf9" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#00f5d4" stop-opacity="0.25"/>
    </linearGradient>
    <clipPath id="clip">
      <rect width="1200" height="260" rx="16"/>
    </clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <!-- Background -->
    <rect width="1200" height="260" fill="url(#bg)"/>

    <!-- Soft glow circles -->
    <circle cx="1040" cy="30" r="170" fill="#00f5d4" opacity="0.08"/>
    <circle cx="130" cy="240" r="150" fill="#00bbf9" opacity="0.08"/>

    <!-- Back wave (slow) -->
    <g>
      <path fill="url(#waveB)" d="M0 205 C150 165 450 245 600 205 C750 165 1050 245 1200 205 C1350 165 1650 245 1800 205 C1950 165 2250 245 2400 205 L2400 260 L0 260 Z"/>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-1200 0" dur="14s" repeatCount="indefinite"/>
    </g>

    <!-- Front wave (faster) -->
    <g>
      <path fill="url(#waveA)" d="M0 225 C150 195 450 255 600 225 C750 195 1050 255 1200 225 C1350 195 1650 255 1800 225 C1950 195 2250 255 2400 225 L2400 260 L0 260 Z"/>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-1200 0" dur="8s" repeatCount="indefinite"/>
    </g>

    <!-- Name -->
    <text x="600" y="112" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="52" font-weight="800" letter-spacing="3" fill="url(#txt)" opacity="0">
      MANJEET SINGH SHEKHAWAT
      <animate attributeName="opacity" from="0" to="1" dur="1.2s" fill="freeze"/>
    </text>

    <!-- Subtitle -->
    <text x="600" y="160" text-anchor="middle" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="600" letter-spacing="1.5" fill="#94a3b8" opacity="0">
      AI &amp; Data Science  •  Full-Stack Developer  •  Python  •  React
      <animate attributeName="opacity" from="0" to="1" dur="1.2s" begin="0.6s" fill="freeze"/>
    </text>
  </g>
</svg>
